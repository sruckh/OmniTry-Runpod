name: Build and Push OmniTry RunPod Container

# Triggers: Push to main/master, version tags, PRs, manual dispatch
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Environment variables for DockerHub integration
env:
  REGISTRY: docker.io
  IMAGE_NAME: gemneye/omnitry-runpod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Minimal permissions following security best practices
    permissions:
      contents: read    # Read repository contents
      packages: write   # Push to container registry

    steps:
    # Standard checkout using HTTPS (works with configured GitHub repository)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Set up Docker Buildx for advanced build features and caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Login to DockerHub using configured secrets (skip for PRs)
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Extract metadata for proper tagging (latest, version tags, etc.)
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    # Build and push Docker image (AMD64 only per GOALS.md requirements)
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64  # AMD64 only per GOALS.md
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha    # Use GitHub Actions cache
        cache-to: type=gha,mode=max

    # Update Docker Hub description using README.md (main branch only)
    - name: Update Docker Hub Description
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: peter-evans/dockerhub-description@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        repository: ${{ env.IMAGE_NAME }}
        readme-filepath: ./README.md